# Cloudflare Workers deployment configuration for MyRPG.IO.
# This Worker has no custom-domain route yet; the workers.dev address is the
# verification target until the owner explicitly approves the DNS cutover.
name = "myrpg-io"
main = "dist/server/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
no_bundle = true

[assets]
directory = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "myrpg-production"
database_id = "a9c8b715-3698-4d47-a606-0b5bbd60a103"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "myrpg-media"

[observability]
enabled = true
