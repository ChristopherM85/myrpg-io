# Cloudflare Workers deployment configuration for MyRPG.IO.
# `pnpm run build` produces this Worker entry point and public asset directory.
# Keeping these paths explicit prevents a GitHub build from deploying a stale
# Worker artifact from the repository root.
name = "myrpg-io"
main = "dist/server/index.js"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"

[[d1_databases]]
binding = "DB"
database_name = "myrpg-production"
database_id = "a9c8b715-3698-4d47-a606-0b5bbd60a103"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "myrpg-media"
